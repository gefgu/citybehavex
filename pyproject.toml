[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "citybehavex"
version = "0.1.3"
description = "Scalable, empirically validated, LLM-assisted urban behavior simulation platform."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "gefgu", email = "gefgu@hotmail.com" }]
requires-python = ">=3.11.4"
keywords = ["urban-mobility", "simulation", "synthetic-population", "agent-based-modeling", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "contextily>=1.7.0",
    "duckdb>=1.5.3",
    "geopandas>=1.1.3",
    "h3>=4.4.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "joblib>=1.4.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pydantic>=2.0.0",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sentence-transformers>=3.0.0",
    # nomic-ai/nomic-embed-text-v1.5's remote code (every shipped config's
    # default embedding model) calls PreTrainedModel.get_extended_attention_mask,
    # which transformers 5.x removed -- confirmed the model fails to load under
    # transformers 5.17.0 and works under 4.57.6. sentence-transformers itself
    # allows transformers up to <6.0.0, so this needs its own explicit bound.
    # The floor (not just <5.0.0) matches what vllm 0.20-0.23 also accept, so
    # the embeddings extra below can still resolve in the same lockfile.
    "transformers>=4.56.0,<5.0.0",
    # geo/vis are fastmob's current extras; vis pulls in fastmob-vis directly.
    "fastmob[geo,vis]>=0.3.2",
    "typer>=0.12.0",
    "einops>=0.8.2",
    "torch>=2.11.0,<2.12.0",
]

[project.optional-dependencies]
# Auto-launching a local embedding server for SW-CRP schedule selection needs vLLM
# (heavy, GPU). Without this extra, set `embedding.base_url` to a running server,
# rely on cached `diary_embeddings.npz`, or set `embedding.enabled: false` to fall
# back to identity similarity (exact preferential return).
embeddings = [
    # vllm 0.24.0 requires transformers>=5.5.3, which conflicts with the base
    # transformers<5.0.0 pin above (nomic-embed-text-v1.5's remote code needs
    # transformers<5.0). vllm 0.20-0.23 all pin the identical torch==2.11.0
    # (same CUDA 13 / RTX 5090 support) but accept transformers>=4.56.0 with
    # 5.0.x-5.4.x and 5.5.0 excluded -- 0.23.0 is the newest of those.
    "vllm>=0.23.0,<0.24.0",
    "torch>=2.11.0,<2.12.0",
    "transformers>=4.56.0,<5.0.0",
]
finetuning = [
    # CUDA 13 / PyTorch 2.11 includes sm_120 kernels required by RTX 5090.
    "accelerate>=0.26.0",
    "datasets>=3.0.0",
    "transformers>=4.56.0,<5.0.0",
]
# web/backend/app imports fastapi directly and is run via uvicorn, but
# neither was ever declared as a dependency anywhere in the repo -- every
# other import it uses is already covered by the base dependencies above.
# Source-checkout only: web/ isn't part of the published wheel at all.
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
[project.urls]
Homepage = "https://github.com/gefgu/citybehavex"
Repository = "https://github.com/gefgu/citybehavex"
Issues = "https://github.com/gefgu/citybehavex/issues"

[project.scripts]
citybehavex = "citybehavex.cli:app"

[tool.maturin]
module-name = "citybehavex._core"
python-source = "."
manifest-path = "citybehavex-py/Cargo.toml"
include = [
    "citybehavex/category/*.csv",
    "citybehavex/templates/**",
    # Wheels already get NOTICE via maturin's own license-file auto-detection
    # (dist-info/licenses/NOTICE); the sdist doesn't, so it's added explicitly
    # here, scoped to sdist only to avoid a stray root-level copy in wheels.
    { path = "NOTICE", format = "sdist" },
]

# PyPI's torch wheel is CPU-only. Pin the PyTorch CUDA 13 index so `uv sync`
# installs a build that contains RTX 5090 (sm_120) kernels.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Development-only sibling overrides.  These do not become wheel metadata:
# release installs resolve the published fastmob and fastmob-vis distributions.
fastmob = { path = "../fastmob", editable = true }
fastmob-vis = { path = "../fastmob/fastmob-vis", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: exercises the real Rust simulation core end-to-end rather than mocking it",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["citybehavex-py", "notebooks", "checkpoints", "target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

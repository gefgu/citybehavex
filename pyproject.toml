[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "citybehavex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "contextily>=1.7.0",
    "duckdb>=1.5.3",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "h3>=4.4.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "joblib>=1.4.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.9",
    "notebook>=7.5.6",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "pydantic>=2.0.0",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "fastmob-vis>=0.1.0",
    "fastmob[data,generation,tessellation,diversity]>=0.1.1",
    "tqdm>=4.67.3",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Auto-launching a local embedding server for SW-CRP schedule selection needs vLLM
# (heavy, GPU). Without this extra, set `embedding.base_url` to a running server,
# rely on cached `diary_embeddings.npz`, or set `embedding.enabled: false` to fall
# back to identity similarity (exact preferential return).
embeddings = [
    # Keep vLLM on the CUDA 12.4/PyTorch 2.6 line for compatibility with
    # systems whose NVIDIA driver reports CUDA driver API 12040.
    "vllm>=0.8.5,<0.9.0",
    "torch==2.6.0",
    "transformers>=4.51.1,<5.0.0",
]
finetuning = [
    "accelerate>=0.26.0",
    "datasets>=3.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.6.0",
    "transformers>=4.51.1,<5.0.0",
]
[project.scripts]
citybehavex = "citybehavex.cli:app"

[tool.maturin]
module-name = "citybehavex._core"
python-source = "."
manifest-path = "citybehavex-py/Cargo.toml"
include = ["citybehavex/category/*.csv"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: exercises the real Rust simulation core end-to-end rather than mocking it",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["citybehavex-py", "notebooks", "checkpoints", "target"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# `fastmob`/`fastmob-vis` are versioned PyPI dependencies above (pending
# publication). Until they're published, `uv sync`/`uv run` cannot resolve
# them (there's nothing on PyPI yet to satisfy the version constraint), and
# uv refuses a `sources` path override in a sibling `uv.toml` once a
# `pyproject.toml` with `[project]` already exists in the same directory
# ("sources is only applicable in the context of a project, and should be
# placed in a pyproject.toml file instead"). For local development against
# a sibling `../fastmob` checkout, install them directly into `.venv` once
# and then use `.venv/bin/python` directly rather than `uv sync`/`uv run`
# (see the `dev-env-gotchas` note on why `uv sync` is best avoided here
# anyway):
#
#   uv pip install --no-config -e ../fastmob
#   uv pip install --no-config -e ../fastmob/fastmob-vis
#
# Do not add a `[tool.uv.sources]` path override here — this file must
# resolve for outside contributors once the packages are on PyPI.

[package]
name = "citybehavex-web"
version = "0.1.0"
edition = "2024"
default-run = "citybehavex-web"

[lib]
name = "citybehavex_web"
path = "src/lib.rs"

[[bin]]
name = "citybehavex-web"
path = "src/main.rs"

[[bin]]
name = "export_static_demo"
path = "src/bin/export_static_demo.rs"

[dependencies]
fastmob-core = { path = "../../../fastmob/fastmob-core" }
fastmob-vis = { path = "../../../fastmob/fastmob-vis" }
fastmob-rs = { path = "../../../fastmob/fastmob-rs" }
rustc-hash = "2"

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "fs", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# `double_option` distinguishes "field absent" from "field present but null"
# in PATCH request bodies, matching Pydantic's `model_dump(exclude_unset=True)`.
serde_with = "3"

chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
lru = "0.12"
h3o = "0.10"
rayon = "1"
duckdb = { version = "1", features = ["bundled"] }
polars = { version = "0.51", features = ["lazy", "new_streaming", "parquet", "temporal", "dtype-full", "strings", "trigonometry", "round_series", "is_between", "cum_agg"] }

tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"

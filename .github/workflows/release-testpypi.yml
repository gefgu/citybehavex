name: Release candidate to TestPyPI

on:
  push:
    tags: ["v*-rc*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest'
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          # --find-interpreter's own discovery doesn't reliably pick up a
          # freshly-installed 3.11 (neither a fresh uv install inside the
          # manylinux container nor actions/setup-python's install on
          # macOS/Windows) -- see before-script-linux below and the second
          # maturin-action step for macOS/Windows. Build everything else
          # (3.12+, including free-threaded) via discovery as before.
          args: --release --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.11
            PY311="$(uv python find 3.11)"
            maturin build --release --out dist -i "$PY311"
      - uses: PyO3/maturin-action@v1
        if: matrix.os != 'ubuntu-latest'
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist -i python3.11
      - uses: PyO3/maturin-action@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/

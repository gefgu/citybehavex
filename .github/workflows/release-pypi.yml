name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]*"
      - "!v*-*"

jobs:
  build:
    # Linux-only for this first release, to skip the macos-13 runner queue
    # bottleneck. macOS/Windows users fall back to the sdist (needs a Rust
    # toolchain to build locally) until a follow-up release adds prebuilt
    # wheels for those platforms -- see release-testpypi.yml for the full
    # 4-platform matrix to restore here when that happens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          # --find-interpreter's own discovery doesn't reliably pick up a
          # freshly-installed 3.11, so it gets its own explicit -i build via
          # before-script-linux; --find-interpreter covers everything else
          # (3.12+, including free-threaded) already bundled in the image.
          args: --release --out dist --find-interpreter
          manylinux: auto
          before-script-linux: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.11
            PY311="$(uv python find 3.11)"
            maturin build --release --out dist -i "$PY311"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # v0.1.0's 7 wheels already uploaded successfully on the first
          # attempt; only the sdist failed (License-File NOTICE, now fixed).
          # Re-running this workflow would otherwise error re-uploading
          # files PyPI already has.
          skip-existing: true

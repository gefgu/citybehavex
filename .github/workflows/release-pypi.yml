name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]*"
      - "!v*-*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # macos-13 (Intel) dropped: its GitHub-hosted runner queue has
          # repeatedly stalled releases for 15+ minutes to 16+ hours across
          # every attempt so far, while macos-14 (Apple Silicon) has never
          # had this problem. Intel Mac users fall back to the sdist (needs
          # a Rust toolchain locally) until this is revisited.
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest'
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          # --find-interpreter's own discovery doesn't reliably pick up a
          # freshly-installed 3.11 (neither a fresh uv install inside the
          # manylinux container nor actions/setup-python's install on
          # macOS/Windows) -- see before-script-linux below and the second
          # maturin-action step for macOS/Windows. Build everything else
          # (3.12+, including free-threaded) via discovery as before.
          args: --release --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install 3.11
            PY311="$(uv python find 3.11)"
            maturin build --release --out dist -i "$PY311"
      - uses: PyO3/maturin-action@v1
        if: matrix.os != 'ubuntu-latest'
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist -i python3.11
      - uses: PyO3/maturin-action@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Lets a retried/re-triggered run skip files a prior attempt for
          # the same version already uploaded successfully, instead of
          # erroring on the duplicate filename (hit this during v0.1.0's
          # release: wheels succeeded, only the sdist failed and needed a
          # retry).
          skip-existing: true

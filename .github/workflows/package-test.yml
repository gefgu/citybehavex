name: Package smoke tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: pipx run maturin build --release --out dist -i python
      - name: Smoke test installed wheel
        run: |
          DIST_DIR="$(pwd)/dist"
          python -m venv /tmp/citybehavex-wheel-test
          /tmp/citybehavex-wheel-test/bin/pip install --find-links "$DIST_DIR" citybehavex
          # Run from outside the checkout: it has its own citybehavex/ source
          # directory (no compiled _core), which Python's CWD-based import
          # resolution would otherwise shadow the installed wheel with.
          cd /tmp
          /tmp/citybehavex-wheel-test/bin/citybehavex --help
          /tmp/citybehavex-wheel-test/bin/python -c 'import citybehavex._core'

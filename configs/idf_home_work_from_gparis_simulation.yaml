# idf 504-agent home+work comparison config, v2: derives home/work H3 res-10 cells directly
# from data/gparis/gparis_visitation_df.parquet itself (the actual comparison ground truth),
# replacing the earlier data/idf_home_work_h3_res10.parquet external file, whose home/work
# inference was a different, buggier process than the survey rows used for comparison (it
# produced at least one clearly-wrong point -- an agent's WORK pinned to the exact bbox corner,
# generating repeated ~88 km legs). Confirmed by a single test run: with these corrected
# anchors, the HOME<->WORK leg W1 gap collapsed from 8.6-9.9 km (every earlier run) to 1.34 km,
# and the "touches OTHER" leg gap -- previously assumed to be pure model/calibration behavior --
# also collapsed from 5-6 km to 1.36 km, meaning most of that gap was fallout from the bad
# external anchors too, not something the earlier 6-round rho/gravity_deterrence_exponent
# calibration was actually fixing on its own merits.
#
# Note: gparis_visitation_df.parquet's own `area` H3 column has lat/lon SWAPPED (decodes near
# the equator/prime meridian, not Paris) -- not usable directly. Cells here are recomputed from
# the correct (lat, lon) columns via h3_latlng_to_cell_string(lat, lon, 10), then the
# most-frequent (mode) HOME-purpose cell and WORK-purpose cell per user_id is taken as that
# agent's home_tile/work_tile. All 504 users have both HOME and WORK rows (no null-island
# placeholder issue like the external file had) -- all 504 are used, not just 500.
# Home-work distance distribution came out sane: mean 9.68 km, median 6.69 km, max 48.8 km
# (vs. the external file's implied mean ~18 km and one agent's 88 km round trips).
#
# RESET for this v2 calibration series: the old rho=0.25/gravity_deterrence_exponent=-4.5 were
# tuned against the WRONG (external-file) home/work anchors, so they don't necessarily carry
# over -- reset simulation to gparis_simulation.yaml's plain defaults (rho=0.6, gamma=0.21,
# gravity_deterrence_exponent=-2.5) and restart a fresh 3-round CALIBRATION.md-guided series
# from there. alignment_base_url ports are pointed at 8082/8083/8084/8005 (this session's own
# live aligner/embedding servers), not the gparis/shanghai configs' current :8090 entries,
# which nothing was listening on when checked.
tessellation:
  path: data/idf/results/idf_gparis_tessellation_home_work_from_gparis.parquet
  min_lon: 1.7
  min_lat: 48.5
  max_lon: 2.975
  max_lat: 49.16
  poi_tessellation: true
  overture_release: 2026-08-19.0
  min_poi_count: 1
  relevance_column: relevance
  output: data/gparis/results/gparis_poi_tessellation.parquet
simulation:
  agents: 504
  days: 7
  output: data/idf/results/idf_home_work_from_gparis_trajectories.parquet
  random_state: 42
  relevance_column: relevance
  granularity_minutes: 15
  car_speed_kmh: 60.0
  rho: 0.6
  gamma: 0.21
  alpha: 0.2
  dt_update_mob_sim_hours: 168.0
  indipendency_window_hours: 0.5
  gravity_deterrence_exponent: -3.2
  gravity_origin_exponent: 1.0
  gravity_destination_exponent: 1.0
  start_date: null
road_network:
  enabled: true
  nodes_output: data/gparis/results/gparis_road_graph_nodes.parquet
  edges_output: data/gparis/results/gparis_road_graph_edges.parquet
  snap_output: data/idf/results/idf_home_work_from_gparis_road_graph_snap.parquet

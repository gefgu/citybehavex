#
# Calibration log (v2, correct anchors), run 1 -> run 2:
#   Run 1 (all defaults) vs. table.tex: jump length 0.87 vs 1.32 km and radius of gyration
#   0.33 vs 0.93 km are both UNDERSHOOTING now -- the opposite direction from every run in the
#   old (wrong-anchor) series. Makes sense: home/work are now correctly close together (mean
#   9.68 km apart) with HOME<->WORK legs matching almost exactly (W1=0.62), so gparis's default
#   gravity_deterrence_exponent=-2.5 -- which was calibrated for a population with more spread
#   -- now clusters OTHER-purpose trips too tightly (touches-OTHER median 2.23 vs 0.77 km, a
#   ~2.9x overshoot on the median itself, unlike the old series where medians were close and
#   only the tail was off). Visits/user is still the worst metric by far (9.95 vs 4.09, 2.4x),
#   same as every prior run regardless of home/work source -- confirms Vf is a diary/schedule-
#   side property, independent of anchor correctness. Trip duration (6.34 vs 5.33) and dwell
#   time (1.01h vs 1.15h) are already close.
#   Run 2 weakens gravity_deterrence_exponent, -2.5 -> -1.5 (less negative = weaker distance
#   decay = longer/more exploratory OTHER trips), targeting the r_g/jump-length undershoot
#   without touching Vf (a separate lever, saved for run 3).
#
# Run 2 result: massive overshoot, not a partial fix. Jump length flipped from a 0.66x
# undershoot (0.87 km) to a 4.25x overshoot (5.61 km); r_g 0.33 -> 2.36 km (target 0.93);
# touches-OTHER median jumped from 2.23 to 8.07 km (target 0.77). The exponent is highly
# nonlinear over this range -- a 1.0 step flipped undershoot into overshoot with no visible
# sweet spot in between yet. Vf stayed flat (9.95 -> 9.86), confirming it's independent of
# this lever as expected.
#
# Calibration log, run 2 -> run 3 (final round of this batch):
#   Bisect between run 1's -2.5 (undershoot) and run 2's -1.5 (overshoot): -2.0.
#
# Run 3 result: still overshoots (dr 2.94 vs 1.32, rg 1.42 vs 0.93), less than run 2 but more
# than run 1 undershot. By SUM of relative error across all 5 metrics: run1=2.73, run3=4.33,
# run2=8.08 -- run 1 (the untouched gparis default, -2.5) is the best of all three, not the
# "improved" ones. Pushing the exponent in either direction traded a mild r_g/jump-length
# undershoot for a larger overshoot on the same two metrics, and didn't move Vf at all (9.9-10.0
# in every one of the 3 runs) since it isn't the right lever for that metric. RESET to -2.5
# (run 1's setting, this batch's actual best) rather than keeping run 3's change.
# Honest takeaway: with the anchors now correct, gparis's plain defaults already sit closer to
# real GreaterParis mobility on 4 of 5 metrics than anything tried this round; the one real
# remaining gap is Vf (~9.9 vs 4.09 target, present in every run regardless of this lever) --
# next candidate per CALIBRATION.md is diaries.location_count_mu/max_locations, not touched yet.
#
# v3 calibration series (this batch): start over from the v2-series default
# (location_count_mu=1, sigma=0.75, max_locations=6; gravity_deterrence_exponent=-2.5, the v2
# winner) -- the 3-seed replicate baseline for this is data/ablation_logs/gparis_mainpaper_run{42,43,44}.
# Round 1 (Vf, CALIBRATION.md lever diaries.location_count_*): mu 1->0.6, sigma 0.75->0.6,
# max_locations 6->5. Single-seed test (gparis_vftune_run42) already ran this exact change:
# Vf 9.996->6.627 (big improvement, target 4.09), dr 0.847->0.929 (still well under target 1.32),
# rg 0.332->0.403 (still well under target 0.93), dt 49.96->61.35 min (0.83h->1.02h, target 1.15h,
# improving), td 5.60->5.96 min (target 5.33, slightly worse). Net win, kept -- no rerun needed.
# Round 2 (TD, CALIBRATION.md lever simulation.car_speed_kmh): round 1's td got slightly worse
# (5.60->5.96 vs target 5.33) alongside the Vf fix. Testing car_speed_kmh 50->60 on top of round 1's
# location_count values, hypothesis: synthetic car trips take longer than real, faster car speed
# should shrink td error.
# Round 2 result (gparis_cal_r2_run42): td 5.96->5.78 (target 5.33), improved, right direction.
# dr/rg/dt/vf all flat (0.929->0.921, 0.403->0.402, 1.022->1.027, 6.627->6.611) as expected --
# car_speed_kmh only touches td. Round 3: push further, car_speed_kmh 60->70, watching for the
# gravity_deterrence_exponent-style overshoot (a 1.0x step only closed ~46% of the remaining gap,
# so a bigger nudge is worth trying before assuming linearity breaks down).
# Round 3 result (gparis_cal_r3_run42): overshot -- td got WORSE (5.78->5.88) and rg drifted
# (0.402->0.421), non-monotonic same as the earlier gravity_deterrence_exponent series. 60 was
# the local optimum for this lever, not 70. REVERTED to car_speed_kmh=60 (round 2's value).
# Round 4 (Vf, CALIBRATION.md lever simulation.gamma): Vf is still the biggest remaining gap
# (~6.6 vs target 4.09, 1.6x over) even after round 1's location_count fix. Testing gamma
# 0.21->0.35 (stronger preferential return -> more repeat visits, fewer distinct locations) on
# top of round 2's car_speed_kmh=60, keeping location_count at round 1's values.
# Round 4 result (gparis_cal_r4_run42): a wash -- vf barely moved (6.611->6.502, still ~1.6x over
# target 4.09) while td regressed (5.78->6.03, away from target 5.33); dr/rg improved slightly but
# were already comfortably under target so that's not a real win. Not worth the td regression.
# REVERTED gamma to 0.21. v3 series (4 rounds) DONE -- final state: location_count_mu=0.6,
# sigma=0.6, max_locations=5 (round 1, kept), car_speed_kmh=60 (round 2, kept), gamma=0.21 and
# gravity_deterrence_exponent=-2.5 (both unchanged from v2 defaults). vs. baseline
# (gparis_mainpaper_run42/43/44, mean): dr 0.99->0.92, rg 0.44->0.40, td 6.39->5.78, dt 0.79->1.03,
# vf 10.22->6.6 (~1.6x over target 4.09 remains the one open gap; every lever tried this series
# that touched vf (round 1's location_count, round 4's gamma) either helped once and then
# plateaued, or didn't move it -- Vf looks like it needs a schedule/diary-side fix beyond what
# these 4 rounds covered, not a quick knob turn).
#
# v4 calibration series (this batch, after diaries.schedule_guidance round 2 above was kept):
# checking the FULL metric set for the first time after a schedule_guidance-only fix revealed
# dr/rg/td/dt had regressed as an unmonitored side effect (see diaries.schedule_guidance's own
# log comment). Baseline for this series = data/ablation_logs/gparis_final_run{1,2,3} (3-seed,
# schedule_guidance kept, simulation.* still at v3-series defaults): dr=1.825 rg=0.613 td=7.34
# dt=2.205(h) vf=0.891 vpd=0.182 atm=7.55 dard=3.178 cpc=0.2594 (mean W1/JSDx100, single-seed
# gparis_calibrated_run1's raw means: jump synth 7.86 vs obs 6.09km, dwell synth 447 vs obs
# 316min, trip_duration synth 14.41 vs obs 7.30min -- all overshooting from the guidance change).
# Round 1 (dt, lever activities.act_dur_scale 1.0->0.72): WRONG LEVER -- barely moved dt (447->444
# synth mean, ~1%) despite a 28% cut. Root cause: act_dur_scale only feeds the micro-activity
# sidecar table (activity_pipeline.py), not the main trajectory's stop-level dwell_minutes the
# report actually measures (frames.py's _build_trip_frame, sourced from the Rust simulation core).
# Net loss elsewhere too (dr/td/vf/dard/cpc all worse). REVERTED.
# Round 2 (td, lever simulation.car_speed_kmh 60->85): lever saturated under the current
# (post-guidance) setup -- td got slightly WORSE (7.34->7.431 W1; synth mean 14.41->14.73,
# moving further from target) despite a 42% speed increase, contradicting the v3 series' "car_speed
# only touches td" assumption; likely because most trips here are short enough to be walk/bike-mode
# (car_speed_kmh can't shorten those), and the change produced unpredictable knock-on effects
# (vf worse +9.5%, dard/cpc worse) rather than the clean isolated effect the v3-era log assumed.
# REVERTED.
# Round 3 (dr, lever simulation.gravity_deterrence_exponent -2.5->-3.2, prioritizing dr over rg
# since they conflict on this one lever and dr's error was ~3x rg's): STRONG NET WIN. dr
# 1.825->1.083 (-40.7%), td 5.853 (-20.3%, unexpected bonus -- shorter jumps -> shorter trips,
# jump length and trip duration are mechanically linked even though CALIBRATION.md lists them as
# separate levers), dt flat, vf/vpd/atm/cpc all improved too. rg regressed 0.613->0.993 (+62%,
# further undershoot: synth mean 5.09 vs obs 5.90) as predicted, and dard regressed slightly --
# smaller in magnitude than the dr+td gains. KEPT -- gravity_deterrence_exponent=-3.2 is this
# series' final value.
# Round 4 (rg recovery, lever simulation.rho 0.6->0.78 on top of round 3's -3.2): bad trade -- rg
# barely moved (0.993->0.955, only -3.8%, did not meaningfully recover round 3's regression) while
# vf blew up (0.835->1.349, +61.6%) and atm/dard also regressed. REVERTED; round 3 alone remains
# the best config found this series.
# v4 series (4 single-seed rounds, seed 42) DONE. Final state: gravity_deterrence_exponent=-3.2
# (round 3, kept), everything else unchanged from v3. rg is now the largest remaining single-metric
# gap and the accepted trade-off for this series -- CALIBRATION.md's next candidate is
# profiles.work_distance_* (separate from gravity_deterrence_exponent, controls commute-specific
# spread rather than general exploratory jump/rog together) or simulation.rho at a smaller step
# than round 4's, not attempted this pass (round budget exhausted). NOTE: this is a single-seed
# (run42) result, not yet re-validated across the 3-seed replicate the earlier series used --
# treat as a strong preliminary signal, re-run gparis_final_run{1,2,3}-style 3 seeds before citing
# in the paper table.

# Round 2 of yjmob Vf improvement experiment. r1 (location_count_mu 1.5->1.9,
# sigma 0.65->0.9, max_locations 9->10) made Vf WORSE (105.1->120.6) and
# narrowed the distribution further (std 76.6->51.8) instead of widening it.
# Root cause: visits_per_user = total collapsed stay-episode count per user
# (citybehavex/reports/comparison.py's _collapse_to_stays, not distinct
# locations). location_count_mu/sigma feed a rounded-lognormal draw whose
# formula mean = exp(mu + sigma^2/2); r1's mu=1.9/sigma=0.9 gives
# exp(1.9+0.405)=~10.0, landing almost exactly on diaries.max_locations'
# pydantic schema ceiling (le=10) -- most of the distribution's upper mass
# got clipped at the cap instead of spreading out, which compresses rather
# than widens variance. This round uses a much smaller push that stays
# clear of the ceiling: mu 1.5->1.6, sigma 0.65->0.75
# (formula mean = exp(1.6+0.281)=~6.5, well under the cap=10), keeping
# max_locations at schema default (9) since r1's push to 10 wasn't the
# helpful part.
tessellation:
  min_lon: 136.5
  min_lat: 34.6
  max_lon: 137.7
  max_lat: 35.75
  resolution: 8
  enrich_overture: true
  output: data/yjmob/yjmob_h3_tessellation.parquet
simulation:
  agents: 50000
  days: 75
  start_date: '2019-09-15'
  output: data/yjmob/yjmob_improve_vf_r2_trajectories.parquet
  random_state: 42
  stream_output: true
  relevance_column: total_poi_count
  granularity_minutes: 30
  car_speed_kmh: 40.0
  rho: 0.6
  gamma: 0.21
  alpha: 0.2
  dt_update_mob_sim_hours: 168.0
  indipendency_window_hours: 0.5
  gravity_deterrence_exponent: -3.5
  gravity_origin_exponent: 1.0
  gravity_destination_exponent: 1.0
road_network:
  enabled: true
  nodes_output: data/yjmob/yjmob_road_graph_nodes.parquet
